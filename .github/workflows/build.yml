name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -o bin/orig-hub-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/orig-hub

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orig-hub-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/orig-hub-${{ matrix.goos }}-${{ matrix.goarch }}

  wails-build:
    name: Wails Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Wails app
        run: wails build -platform ${{ matrix.platform }}/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orig-hub-wails-${{ matrix.platform }}
          path: build/bin/*
