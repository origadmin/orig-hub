name: CI

# 门禁分层（对应 AGENTS.md 的规约；本地钩子可被 --no-verify 绕过，CI 是最后一道闸）：
#   engine   —— 引擎单测 + release 构建 + **sidecar 陈旧检测**（BUG-055 / BUG-061：
#               「开发者全绿、用户体感不变」正是产物与源码脱节造成的，必须在这里响）
#   shell    —— 前端类型检查 + 构建（BUG-054 那类「改了源码但产物没跟上」的前端侧同理）
#   registry —— 缺陷登记册一致性（编号连续 / 索引↔文件双向 / 引用路径与 hash 真实存在）
#               + 提交信息门禁（英文；`fix` 必须引用 BUG 编号）
#               + 目录污染门禁（AGENTS.md §6：根 4 文件白名单 / AI 目录 / 未跟踪残留）
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 兜底跑一次：日常没人提交时也能发现「产物比源码旧」这类时间性腐化。
    - cron: '0 3 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  engine:
    name: Engine · tests + sidecar freshness
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: download-engine

      - name: Unit tests (orig-tg)
        working-directory: download-engine
        run: cargo test -p orig-tg --lib

      - name: Release build (produces sidecar artifacts)
        working-directory: download-engine
        run: cargo build --release -p orig-tg -p orig-daemon

      - name: Sync sidecars (externalBin source + shell target copies)
        shell: bash
        run: sh scripts/sync-sidecars.sh

      - name: Sidecar freshness gate (stale artifact must fail here)
        shell: bash
        run: |
          # `--check` 不写盘：它断言的是「release 产物不旧于 crate 源码」且
          # externalBin 源与 cargo 产物逐字节一致。产物与源码脱节时这里必须红。
          sh scripts/sync-sidecars.sh --check

  shell:
    name: Shell · typecheck + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri-shell/package-lock.json

      - name: Install
        working-directory: tauri-shell
        run: npm ci

      - name: Typecheck
        working-directory: tauri-shell
        run: npx tsc --noEmit

      - name: Build
        working-directory: tauri-shell
        run: npx vite build --outDir dist_ci

  registry:
    name: Registry · bug tracking + commit policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 登记册要校验「引用的提交 hash 在本仓库真实存在」，浅克隆会假阴性。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bug registry consistency
        run: python3 scripts/check-bugs.py

      - name: Commit message policy (English only; fix must cite BUG-<id>)
        shell: bash
        run: |
          set -eu
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base 不可解析（首次推送/定时任务），退化为最近 50 条审计模式。"
            python3 scripts/check-commit-msgs.py --all
          else
            python3 scripts/check-commit-msgs.py "$BASE..$HEAD"
          fi

      - name: Repo pollution gate (root whitelist + AI dirs + residue)
        # AGENTS.md §6：根只允许 4 个文件 / 不得跟踪产物与 AI 工具目录 / 不得存在未忽略的残留。
        # 与本地 .git/hooks/pre-commit 跑**同一个脚本**（单一真源）。
        # 历史：欠账未清时这里只告警（continue-on-error），现已清偿 → 升为阻断，
        # 否则「污染可见但不疼」等于门禁不存在。
        shell: bash
        run: sh scripts/check-pollution.sh
