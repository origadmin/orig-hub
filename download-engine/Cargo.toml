[workspace]
resolver = "2"
members = [
    "crates/orig-core",
    "crates/orig-net",
    "crates/orig-protocol-virtual",
    "crates/orig-protocol-http",
    "crates/orig-daemon",
    "crates/orig-tg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
thiserror = "1"
reqwest = { version = "0.12", features = ["stream", "http2", "socks", "rustls-tls"] }
if-addrs = "0.13"
# OS known-folder lookups (download dir / home dir); avoids hand-rolled $HOME probing (BUG-071).
dirs = "6"
