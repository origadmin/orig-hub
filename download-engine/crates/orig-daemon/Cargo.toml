[package]
name = "orig-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "orig-daemon"
path = "src/main.rs"

[dependencies]
orig-core = { path = "../orig-core" }
orig-net = { path = "../orig-net" }
orig-protocol-virtual = { path = "../orig-protocol-virtual" }
orig-protocol-http = { path = "../orig-protocol-http" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true
uuid.workspace = true
reqwest.workspace = true
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# BUG-319：引擎下载任务的本地持久化。
# 采用与 orig-tg 相同的 libsql 本地后端（`core` feature），避免与 bundled
# sqlite3 的 LNK2005 多重定义链接冲突。
libsql = { version = "0.9.30", features = ["core"], default-features = false }
