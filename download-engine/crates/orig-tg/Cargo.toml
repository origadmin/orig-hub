[package]
name = "orig-tg"
version.workspace = true
edition.workspace = true
description = "orig-hub Telegram source service (MTProto userbot sidecar)"

[[bin]]
name = "orig-tg"
path = "src/main.rs"

[lib]
name = "orig_tg"
path = "src/lib.rs"

[dependencies]
orig-core = { path = "../orig-core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
thiserror.workspace = true

# MTProto 用户客户端（个人订阅归档拉取层）
grammers-client = "0.7"
grammers-session = "0.7"
grammers-mtproto = "0.7"
grammers-tl-types = "0.7"
grammers-crypto = "0.7"