[package]
name = "orig-tg"
version.workspace = true
edition.workspace = true
description = "orig-hub Telegram source service (MTProto userbot sidecar)"

[[bin]]
name = "orig-tg"
path = "src/main.rs"

[lib]
name = "orig_tg"
path = "src/lib.rs"

[features]
# 测试用 mock 客户端（合成频道/消息/缩略图/下载）。
#
# **默认关闭**：生产二进制（sidecar 构建不带任何特性）因此物理上不含合成数据实现，
# 也就不可能存在「连不上 TG → 退回 mock 继续对外服务」这种静默降级（BUG-023）。
#
# 启用后仍需两个显式条件才会被选中：
#   1. `ORIG_TG_MOCK=1`
#   2. 显式 `ORIG_TG_DB`（强制隔离库，防止合成频道/消息污染真实 tg_store.db）
mock = []

[dependencies]
orig-core = { path = "../orig-core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
thiserror.workspace = true

# MTProto 用户客户端（个人订阅归档拉取层）
grammers-client = { version = "0.10", features = ["proxy"] }
grammers-session = "0.10"
grammers-mtproto = "0.10"
grammers-tl-types = "0.10"
grammers-crypto = "0.10"

# 固定 glass_pumpkin 到 2.0.0-rc0（grammers-crypto 0.10 的声明要求；rc1 改了 safe_prime::check 返回 Result 且换 num-bigint 0.5，不兼容）
glass_pumpkin = "=2.0.0-rc0"

# 监控频道/消息/游标的本地 SQLite 存储。
# 采用与 grammers-session 相同的 libsql 本地后端（`core` feature），
# 避免与 bundled sqlite3 的 LNK2005 多重定义链接冲突。
libsql = { version = "0.9.30", features = ["core"], default-features = false }